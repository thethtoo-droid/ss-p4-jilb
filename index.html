          <!-- Floating Particle Sparks -->
          <g fill="#7dd3fc" opacity="0.75">
            <circle cx="290" cy="360" r="2.5" />

            <circle cx="515" cy="275" r="2.4" />

            <circle cx="860" cy="335" r="2.0" />
            <circle cx="945" cy="420" r="2.5" />
            <circle cx="1015" cy="365" r="1.8" />
          </g>

          <!-- Floating PlayStation Geometric Shapes (Triangle, Square, Circle, Cross) -->
          <g fill="none" stroke="#38bdf8" stroke-width="2.4" opacity="0.48">
            <!-- Triangle -->

          <g stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.6" fill="none">

            <!-- Analog Sticks -->

            <circle cx="107" cy="66" r="10.5" fill="#071021" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.4" />

      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svgMarkup)}`;
    }

    const FALLBACK_SVG_URI = buildFallbackSvgDataUri();

    // =========================================================================
    // 3. BACKGROUND MANAGEMENT (localStorage -> background.jpg -> SVG Fallback)
    // =========================================================================
    function applyStageImage(imageUrl, statusNote) {
      ps4Stage.style.backgroundImage = `linear-gradient(to bottom, rgba(4, 11, 24, 0.22), rgba(4, 11, 24, 0.46)), url("${imageUrl}")`;
      if (statusNote) {
        subStatus.textContent = statusNote;
      }
    }

    function loadDefaultOrLocalBackground() {
      // Set fallback SVG immediately so there is zero blank flash
      applyStageImage(
        FALLBACK_SVG_URI,
        "PS4 Host UI Ready • Press 'H' or double-click header for display options"
      );

      // Probe for local 'background.jpg' in the same directory
      try {
        const probeImg = new Image();
        probeImg.onload = () => {
          applyStageImage(
            'background.jpg',
            "Loaded local background.jpg • Press 'H' or double-click header for options"
          );
        };
        probeImg.src = 'background.jpg';
      } catch (err) {
        // Keep fallback SVG artwork if local image is unavailable
      }
    }

    function restoreSavedBackground() {
      try {
        const savedDataUrl = localStorage.getItem(STORAGE_BG_KEY);
        if (savedDataUrl) {
          applyStageImage(
            savedDataUrl,
            "Restored saved custom background • Press 'H' or double-click header for options"
          );
          return true;
        }
      } catch (err) {
        // Ignore storage access errors in sandboxed iframes
      }
      return false;
    }

    function resetBackground() {
      try {
        localStorage.removeItem(STORAGE_BG_KEY);
      } catch (err) {
        // Ignore storage access errors
      }
      loadDefaultOrLocalBackground();
    }

    // =========================================================================
    // 4. STATUS DOT ANIMATION & LOCAL HOST INTEGRATION HOOKS (UI MOCKUP ONLY)
    // =========================================================================
    function startStatusAnimation() {
      try {
        if (statusTimer !== null) {
          clearInterval(statusTimer);
          statusTimer = null;
        }
        dotsCount = 3;
        loadingText.textContent = `${STATUS_PREFIX}... ${STATUS_SUFFIX}`;

        statusTimer = setInterval(() => {
          dotsCount = (dotsCount % 3) + 1;
          loadingText.textContent = `${STATUS_PREFIX}${'.'.repeat(dotsCount)} ${STATUS_SUFFIX}`;
        }, 500);
      } catch (err) {
        subStatus.textContent = 'Status indicator paused.';
      }
    }

    /**
     * Local Host Integration Hook (Placeholder Only — No Exploit Code Included)
     * When hosting locally on your own server, you can connect your own legitimate
     * local scripts or payload loader modules inside this lifecycle hook.
     */
    const HostIntegrationHooks = {
      onHostReady() {
        // Example hook: update status text when your local script module initializes
        // loadingText.textContent = 'GoldHEN v2.4b18.14 Ready';
      },
      onStatusUpdate(message, detail) {
        if (message) loadingText.textContent = message;
        if (detail) subStatus.textContent = detail;
      }
    };

    // =========================================================================
    // 5. EVENT LISTENERS (HIDDEN UTILITY BAR, FILE UPLOAD, FULLSCREEN)
    // =========================================================================
    function toggleUtilityControls() {
      if (topControls) {
        topControls.classList.toggle('is-visible');
      }
    }

    if (topBar) {
      topBar.addEventListener('dblclick', (event) => {
        if (event.target.closest('button')) return;
        toggleUtilityControls();
      });
    }

    document.addEventListener('keydown', (event) => {
      if (
        event.key &&
        event.key.toLowerCase() === 'h' &&
        !event.ctrlKey &&
        !event.metaKey &&
        !event.altKey
      ) {
        const activeTag = document.activeElement && document.activeElement.tagName;
        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;
        toggleUtilityControls();
      }
    });

    if (uploadBgBtn && bgFileInput) {
      uploadBgBtn.addEventListener('click', () => bgFileInput.click());

      bgFileInput.addEventListener('change', (event) => {
        try {
          const file = event.target.files && event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            applyStageImage(dataUrl, `Loaded & saved background: ${file.name}`);
            try {
              localStorage.setItem(STORAGE_BG_KEY, dataUrl);
            } catch (storageErr) {
              subStatus.textContent = `Loaded background: ${file.name} (file too large for localStorage)`;
            }
          };
          reader.onerror = () => {
            subStatus.textContent = 'Failed to read the selected image file.';
          };
          reader.readAsDataURL(file);
        } catch (err) {
          subStatus.textContent = 'Unable to apply selected background image.';
        } finally {
          bgFileInput.value = '';
        }
      });
    }

    if (resetBgBtn) {
      resetBgBtn.addEventListener('click', resetBackground);
    }

    if (replayBtn) {
      replayBtn.addEventListener('click', () => {
        startStatusAnimation();
        subStatus.textContent = 'Status sequence replayed';
      });
    }

    if (fullscreenBtn) {
      fullscreenBtn.addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await ps4Stage.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (err) {
          subStatus.textContent = 'Fullscreen mode is restricted in this preview frame.';
        }
      });
    }

    document.addEventListener('fullscreenchange', () => {
      if (fullscreenBtn) {
        fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
      }
    });

    // =========================================================================
    // 6. INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      if (!restoreSavedBackground()) {
        loadDefaultOrLocalBackground();
      }
      startStatusAnimation();
      HostIntegrationHooks.onHostReady();
    });
  </script>
</body>
</html>
